<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pedidos.css">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="pagina-pedidos">

   <header class="cabecalho-cliente">

    <h2>E-commerce de Livros</h2>

    <nav class="menu-cliente">
        <button class="btn-voltar-catalogo">
            <i class="bi bi-arrow-left"></i>
            Catálogo
        </button>
    </nav>

   </header>

   <main class="pedidos">

        <h1>Meus Pedidos</h1>

        <article class="pedido">

            <div class="cabecalho-pedido">
                <div>
                    <h2>Pedido #1001</h2>
                    <p>Realizado em 22/08/2026</p>
                </div>

                <strong class="status-pedido">
                    Em Processamento
                </strong>
            </div>

            <div class="item-pedido">

                <div class="capa-pedido">
                    Capa
                </div>

                <div>
                    <h3>O Hobbit</h3>
                    <p>Quantidade: 2</p>
                    <p>R$ 99,80</p>
                </div>

            </div>

            <div class="acoes-pedido">
         
                <button class="btn-cancelar-pedido">
                    Cancelar pedido
                </button>

            </div>

        </article>
        
        <article class="pedido">

            <div class="cabecalho-pedido">
                <div>
                    <h2>Pedido #1000</h2>
                    <p>Realizado em 18/08/2026</p>
                </div>

                <strong class="status-pedido">
                    Em rota
                </strong>
            </div>

            <div class="item-pedido">
                <div class="capa-pedido">Capa</div>

                <div>
                    <h3>1984</h3>
                    <p>Quantidade: 1</p>
                    <p>R$ 39,90</p>
                </div>
            </div>

            <div class="acoes-pedido">
                <button class="btn-confirmar-recebimento">
                    Confirmar recebimento
                </button>
            </div>


        </article>

        <article class="pedido">

            <div class="cabecalho-pedido">
                <div>
                    <h2>Pedido #0999</h2>
                    <p>Realizado em 10/08/2026</p>
                </div>

                <strong class="status-pedido">
                    Entregue
                </strong>
            </div>

            <div class="item-pedido">
                <div class="capa-pedido">Capa</div>

                <div>
                    <h3>It</h3>
                    <p>Quantidade: 1</p>
                    <p>R$ 59,90</p>
                </div>
            </div>

            <div class="acoes-pedido">
                <button class="btn-solicitar-troca">
                    Solicitar troca
                </button>
            </div>

        </article>
       
   </main>

   <script src="../js/pedidos.js"></script>
</body>

</html>
