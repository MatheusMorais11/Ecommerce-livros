<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">

    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="pagina-admin">

    <header class="cabecalho-admin">

        <h2>E-commerce de Livros</h2>

        <nav class="menu-admin">

            <button class="btn-sair-admin">
                <i class="bi bi-box-arrow-left"></i>
                Sair
            </button>

        </nav>

    </header>

    <main class="admin">
        
        <h1>Painel Administrativo</h1>

        <section class="opcoes-admin">

            <button class="btn-admin-clientes">
                <i class="bi bi-people"></i>
                Clientes
            </button>

            <button class="btn-admin-catalogo">
                <i class="bi bi-book"></i>
                Catálogo e Estoque
            </button>
            
            <button class="btn-admin-pedidos">
                <i class="bi bi-box-seam"></i>
                Pedidos
            </button>

            <button class="btn-admin-trocas">
                <i class="bi bi-arrow-left-right"></i>
                Trocas e Devoluções
            </button>

            <button class="btn-admin-analise">
                <i class="bi bi-graph-up"></i>
                Análise de Vendas
            </button>

        </section>

    </main>

    <script src="../js/admin.js"></script>
    
</body>
</html>
