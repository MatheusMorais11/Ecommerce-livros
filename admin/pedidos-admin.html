<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Administração</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pedidos-admin.css">

    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="pagina-pedidos-admin">

    <header class="cabecalho-admin">

        <h2>E-commerce de Livros</h2>

        <button class="btn-voltar-admin">
            <i class="bi bi-arrow-left"></i>
            Painel
        </button>

    </header>

    <main class="pedidos-admin">

        <h1>Gerenciamento de Pedidos</h1>

        <div class="filtro-pedidos">

            <label>
                Filtrar por status:

                <select class="filtro-status">
                    <option value="todos">Todos</option>
                    <option value="processamento">Em Processamento</option>
                    <option value="pagamento">Pagamento Realizado</option>
                    <option value="transito">Em Trânsito</option>
                    <option value="entregue">Entregue</option>
                    <option value="troca">Troca Solicitada</option>

                </select>
            </label>

        </div>

        <section class="lista-pedidos">

            <article class="pedido-admin" data-status="pagamento">

                <div class="info-pedido-admin">
                    <h2>Pedido #1001</h2>

                    <p><strong>Cliente:</strong>Cliente 1</p>
                    <p><strong>Data:</strong> 22/08/2026</p>
                    <p><strong>Total:</strong> R$ 109,80</p>
                </div>

                <div class="status-admin">

                    <label>
                        Status:

                        <select class="status-pedido-admin">
                            <option>Em Processamento</option>
                            <option>Pagamento Realizado</option>
                            <option>Em Trânsito</option>
                            <option>Entregue</option>
                        </select>
                    </label>

                    <button class="btn-atualizar-status">
                        Atualizar status
                    </button>
                    
                </div>
                
            </article>

            <article class="pedido-admin" data-status="entregue">

                <div class="info-pedido-admin">
                    <h2>Pedido #1000</h2>

                    <p><strong>Cliente:</strong> Cliente 2</p>
                    <p><strong>Data:</strong> 18/08/2026</p>
                    <p><strong>Total:</strong> R$49,90</p>
                </div>

                <div class="status-admin">

                    <label>
                        Status:

                        <select class="status-pedido-admin">
                            <option>Em Trânsito</option>
                            <option>Entregue</option>
                        </select>
                    </label>

                    <button class="btn-atualizar-status">
                        Atualizar status
                    </button>

                </div>

            </article>

        </section>
    </main>

    <script src="../js/pedidos-admin.js"></script>
    
</body>
</html>
